[Service]
# Bind only White Wolf's private LAN address. UFW further restricts the port
# to Black Beast (192.168.0.100).
Environment=OLLAMA_HOST=192.168.0.103:11434
# Keep both the judgment and grammar models resident.
Environment=OLLAMA_KEEP_ALIVE=-1
Environment=OLLAMA_MAX_LOADED_MODELS=2
Environment=OLLAMA_NUM_PARALLEL=1
