# Whisper Input Configuration

hotkey:
  # Primary hotkey: Win+Alt
  combo:
    - KEY_LEFTMETA
    - KEY_LEFTALT
  # Alternate hotkeys
  alt_combos:
    - [KEY_F24]                     # Logitech Back button via Input Remapper
    - [KEY_PAGEDOWN, KEY_RIGHT]     # Page Down + Right Arrow
    - [KEY_PAGEDOWN, KEY_DOWN]      # Page Down + Down Arrow

audio:
  sample_rate: 16000      # Whisper expects 16kHz
  device_index: null      # null = system default microphone

recording:
  max_duration: 120       # Maximum recording length in seconds

whisper:
  model: "models/ggml-distil-large-v3.bin"
  device: "cuda"          # cuda, cpu, or mps (Mac)

ollama:
  enabled: true
  model: "granite4.1:3b"
  host: "http://127.0.0.1:11434"
  keep_alive: 3600          # Keep model loaded for 1 hour after each request
  skip_threshold: 5
  audio_mode: false             # Deprecated compatibility key; Whisper is always used for ASR.

typer:
  backend: "xdotool"      # xdotool for X11 (respects keyboard layout)

corrections:
  enabled: true
  path: "~/.config/whisper-typer/corrections.tsv"  # Local typo corrections, not committed

feedback:                       # Deprecated compatibility block; currently ignored.
  notifications: false
  sounds: false

# Deprecated compatibility block; wake-word activation is not implemented.
wakeword:
  enabled: false
  model: "alexa"           # Options: hey_jarvis, alexa, hey_mycroft
  threshold: 0.5           # Detection sensitivity (0.1-0.9)

# Silence detection for recording auto-stop
silence:
  threshold: 0.01          # RMS energy threshold
  duration: 1.5            # Seconds of silence to stop
  min_speech_duration: 0.5 # Minimum recording before checking
  max_recording_duration: 120.0  # Maximum recording length (matches recording.max_duration)

# Code Speaker TTS (Kokoro) for Claude Code events
tts:
  enabled: true            # Native Rust Kokoro TTS
  voice: "af_bella"        # Kokoro voice (af_heart, bf_emma, am_adam, etc.)
  speed: 1.0               # Speech speed multiplier
  api_port: 8767           # HTTP API port for hook integration
  model_path: ""           # Path to models/kokoro-v1.0.onnx (empty = auto-detect)
