# Whisper Input Configuration

ui:
  enabled: true
  endpoint: "http://127.0.0.1:8768/events"
  timeout_ms: 200

hotkey:
  # Primary hotkey: Win+Alt
  combo:
    - KEY_LEFTMETA
    - KEY_LEFTALT
  # Alternate hotkeys
  alt_combos:
    - [KEY_F24]                     # Logitech Back button via Input Remapper
    - [KEY_PAGEDOWN, KEY_RIGHT]     # Page Down + Right Arrow
    - [KEY_PAGEDOWN, KEY_DOWN]      # Page Down + Down Arrow

audio:
  sample_rate: 16000      # Whisper expects 16kHz
  device_index: null      # null = system default microphone

recording:
  max_duration: 300       # Maximum recording length in seconds (5 minutes)
  save_audio: true        # Keep exact dictation clips for ASR/model evaluation
  audio_retention_days: 7 # Automatically delete saved audio after 7 days

whisper:
  model: "models/ggml-distil-large-v3.bin"
  device: "cuda"          # cuda, cpu, or mps (Mac)

remote_asr:
  enabled: true
  url: "http://192.168.0.103:8769/transcribe"
  timeout_seconds: 3
  fallback_local: true

punctuation:
  enabled: true
  url: "http://192.168.0.103:8770/punctuate"
  fallback_url: "http://127.0.0.1:8770/punctuate"
  timeout_ms: 1000

ollama:
  enabled: true
  model: "granite4.1:3b"
  host: "http://192.168.0.103:11434"
  keep_alive: -1            # Keep both White Wolf models resident in GPU memory.
  skip_threshold: 0             # Short fragments also need the grammar gate.
  correction_timeout_ms: 3000   # Includes retry; keep cleaned text on timeout.
  audio_mode: false             # Deprecated compatibility key; Whisper is always used for ASR.
  background_review: true  # Paste immediately (~70ms); review suggestions in background window.
  grammar_gate:
    enabled: false
    provider: "ollama"
    decision_format: "pass_repair"
    model: "granite4:350m"
    host: "http://192.168.0.103:11434"
    api_key_file: "~/.config/typesafe/api-key"  # Private file outside this repository.
    timeout_ms: 500
    clean_threshold: 0.2        # Uncertain results also receive a correction pass.
    fragment_threshold: 0.9

typer:
  backend: "xdotool"      # xdotool for X11 (respects keyboard layout)

corrections:
  enabled: true
  path: "~/.config/whisper-typer/corrections.tsv"  # Local typo corrections, not committed

spelling:
  enabled: true                 # Offline, generic duplicated-letter correction.
  aff_path: "/usr/share/hunspell/en_US.aff"
  dic_path: "/usr/share/hunspell/en_US.dic"
  frequency_path: "~/.config/whisper-typer/frequency_dictionary_en_82_765.txt"

feedback:                       # Deprecated compatibility block; currently ignored.
  notifications: false
  sounds: false

# Deprecated compatibility block; wake-word activation is not implemented.
wakeword:
  enabled: false
  model: "alexa"           # Options: hey_jarvis, alexa, hey_mycroft
  threshold: 0.5           # Detection sensitivity (0.1-0.9)

# Silence detection for recording auto-stop
silence:
  threshold: 0.01          # RMS energy threshold
  duration: 1.5            # Seconds of silence to stop
  min_speech_duration: 0.5 # Minimum recording before checking
  max_recording_duration: 300.0  # Maximum recording length (matches recording.max_duration)

# Code Speaker TTS (Kokoro) for Claude Code events
tts:
  enabled: true            # Native Rust Kokoro TTS
  voice: "af_bella"        # Kokoro voice (af_heart, bf_emma, am_adam, etc.)
  speed: 1.0               # Speech speed multiplier
  api_port: 8767           # HTTP API port for hook integration
  model_path: ""           # Path to models/kokoro-v1.0.onnx (empty = auto-detect)
