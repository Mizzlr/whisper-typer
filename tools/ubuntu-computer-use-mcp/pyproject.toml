[project]
name = "ubuntu-computer-use-mcp"
version = "0.1.0"
description = "Local MCP tools for reliable Ubuntu X11 desktop control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.25,<2"]

[project.scripts]
ubuntu-computer-use-mcp = "ubuntu_computer_use_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntu_computer_use_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<9"]
