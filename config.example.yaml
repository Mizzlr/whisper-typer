ui:
  enabled: false # Enable after installing the dictation window.
  endpoint: "http://127.0.0.1:8768/events"
  timeout_ms: 200

hotkey:
  combo: [KEY_LEFTMETA, KEY_LEFTALT]
  alt_combos: []

audio:
  sample_rate: 16000
  device_index: null
  channels: 1
  chunk_size: 1024

recording:
  max_duration: 120

whisper:
  model: "models/ggml-distil-large-v3.bin"
  device: "cuda"

remote_asr:
  enabled: false
  url: "http://127.0.0.1:8769/transcribe"
  timeout_seconds: 30
  fallback_local: true

punctuation:
  enabled: false
  url: "http://127.0.0.1:8770/punctuate"
  fallback_url: null
  timeout_ms: 2000

ollama:
  enabled: true
  model: "granite4.2:3b"
  host: "http://127.0.0.1:11434"
  keep_alive: 3600
  skip_threshold: 5
  correction_timeout_ms: 5000
  background_review: false # Enable after installing the dictation window.
  grammar_gate:
    enabled: false
    provider: "race"            # Jev races the ollama.model judge.
    decision_format: "structured" # Use pass_repair for Granite 350M.
    model: "jev-latest"
    host: "https://api.typesafe.ai"
    api_key_file: "~/.config/typesafe/api-key"  # Store the key outside the repo.
    timeout_ms: 1500
    clean_threshold: 0.2
    fragment_threshold: 0.9

typer:
  backend: "xdotool"

corrections:
  enabled: true
  path: "~/.config/whisper-typer/corrections.tsv"

spelling:
  enabled: false                # Enable after installing hunspell-en-us.
  aff_path: "/usr/share/hunspell/en_US.aff"
  dic_path: "/usr/share/hunspell/en_US.dic"
  frequency_path: ""            # Optional external word-frequency file.

silence:
  threshold: 0.01
  duration: 1.5
  min_speech_duration: 0.5
  max_recording_duration: 120

tts:
  enabled: true
  voice: "af_bella"
  speed: 1.0
  api_port: 8767
  model_path: ""

mcp:
  enabled: true
  port: 8766
